user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 8192;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  charset utf-8;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  keepalive_requests 1000;

  # ── Chống request chậm / treo (slowloris) ──
  client_header_timeout 10s;
  client_body_timeout 15s;
  send_timeout 20s;
  client_header_buffer_size 2k;
  large_client_header_buffers 4 16k;
  # API của hub chỉ nhận JSON nhỏ (app tự chặn > 64KB); upload game đi thẳng lên R2
  client_max_body_size 1m;

  # ── IP thật: Cloudflare gửi IP người dùng ở CF-Connecting-IP, chỉ tin khi request đến từ dải IP Cloudflare ──
  include /etc/nginx/conf.d/cloudflare-ips.inc;
  real_ip_header CF-Connecting-IP;

  # ── Giới hạn theo IP (lớp 2 – trước app; lớp 3 trong app, xem docs/TRAFFIC.md) ──
  limit_req_zone $binary_remote_addr zone=api:20m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=pages:20m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=perip:20m;
  limit_req_status 429;
  limit_conn_status 429;

  log_format main '$remote_addr "$host" "$request" $status $body_bytes_sent $request_time '
                  '"$http_user_agent" rl=$limit_req_status';
  access_log /var/log/nginx/access.log main buffer=32k flush=5s;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript text/javascript application/json
             application/manifest+json image/svg+xml application/xml application/wasm;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;

  upstream hub {
    server app:3000;
    keepalive 32;
  }

  include /etc/nginx/conf.d/*.conf;
}
