<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Neon Flap</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <h1 class="title">Flap</h1>
        <div class="scores">
          <div class="box"><span class="label" data-i18n="score">Điểm</span><span id="score" class="value">0</span></div>
          <div class="box"><span class="label" data-i18n="best">Cao nhất</span><span id="best" class="value">0</span></div>
        </div>
      </header>

      <div id="stage" class="stage">
        <canvas id="canvas" width="360" height="540" aria-label="Neon Flap"></canvas>
        <div id="overlay" class="overlay" role="dialog" aria-live="polite">
          <p id="overlay-title" class="overlay-title" data-i18n="startTitle">Neon Flap</p>
          <p id="overlay-text" class="overlay-text" data-i18n="startText">Nhấn Space, phím ↑ hoặc chạm để bay lên. Né các cột!</p>
          <button id="play" class="btn" type="button" data-i18n="play">Chơi</button>
        </div>
      </div>

      <p id="result" class="result hidden" role="status" aria-live="polite"></p>
      <p id="save-note" class="note hidden" data-i18n="saveNote">Kết nối ví trên Game Hub để lưu điểm và lên bảng xếp hạng.</p>
    </main>
    <script src="/sdk/gamehub-sdk.js"></script>
    <script src="game.js"></script>
  </body>
</html>
