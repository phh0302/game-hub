<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#07070f" />
    <title>Game Hub – Mất kết nối</title>
    <style>
      html, body { margin: 0; height: 100%; background: #07070f; color: #ecebff; font-family: "Segoe UI", system-ui, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; box-sizing: border-box; }
      img { width: 96px; height: 96px; border-radius: 22px; }
      h1 { margin: 8px 0 0; font-size: 24px; }
      p { margin: 0; color: #9a98c3; max-width: 360px; line-height: 1.5; }
      button { margin-top: 8px; padding: 10px 22px; border: 0; border-radius: 10px; background: linear-gradient(90deg, #22e3ff, #ff3ec8); color: #07070f; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>Mất kết nối mạng</h1>
      <p>Game Hub cần Internet để tải game và lưu điểm. Kiểm tra mạng rồi thử lại nhé.</p>
      <p lang="en">You're offline. Game Hub needs an Internet connection to load games and save scores.</p>
      <button type="button" onclick="location.reload()">Thử lại · Retry</button>
    </main>
  </body>
</html>
