# Kiểm tra tự động mỗi lần push / mở pull request vào main:
# cài thư viện → kiểm tra TypeScript → unit test → build production
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Giá trị giả chỉ để build – CI không kết nối database thật
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      # Dùng npm install (giống Vercel) thay vì npm ci: package-lock tạo trên Windows
      # đôi khi lệch vài gói phụ so với Linux, npm ci sẽ báo lỗi dù thư viện vẫn đúng
      - name: Cài thư viện
        run: npm install --no-audit --no-fund

      - name: Kiểm tra schema Prisma
        run: npx prisma validate

      - name: Kiểm tra TypeScript
        run: npm run typecheck

      - name: Unit test
        run: npm test

      - name: Build production
        run: npm run build

      # Lỗi mức "critical" → CI đỏ. Mức "high" đã được đánh giá trong docs/SECURITY.md
      # (chỉ báo cáo, không chặn) – xem lại mỗi lần cập nhật thư viện
      - name: Kiểm tra lỗ hổng thư viện (production)
        run: npm audit --omit=dev --audit-level=critical

      - name: Báo cáo lỗ hổng mức high (tham khảo)
        if: always()
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high

  # Chạy migration trên PostgreSQL thật và kiểm tra database sau migration khớp hoàn toàn
  # với schema.prisma – bắt lỗi migration viết thiếu/sai trước khi lên production
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Cài thư viện
        run: npm install --no-audit --no-fund

      - name: Chạy toàn bộ migration
        run: npx prisma migrate deploy

      - name: Database sau migration phải khớp schema.prisma
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --script --exit-code

      - name: Seed chạy được (2 lần – phải an toàn khi chạy lại)
        run: npx prisma db seed && npx prisma db seed

  # Test trình duyệt thật (Playwright): build production + database thật + ví MetaMask giả lập.
  # Đăng nhập ví → chơi game lưu điểm → hồ sơ + ảnh đại diện → trang quản trị → chia sẻ / SEO
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DATABASE_URL_UNPOOLED: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-only-secret-0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      # Ví admin của test = khóa mẫu công khai Hardhat #0 (xem tests/e2e/wallet.ts)
      ADMIN_WALLETS: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
      STORAGE_DRIVER: local
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Cài thư viện
        run: npm install --no-audit --no-fund

      - name: Tạo bảng + dữ liệu mẫu
        run: npx prisma migrate deploy && npx prisma db seed

      - name: Build production
        run: npm run build

      - name: Cài trình duyệt Chromium
        # Máy chạy GitHub đã có sẵn gần hết thư viện hệ thống; khi kho apt của Ubuntu lỗi mạng
        # thì vẫn cài trình duyệt (không kèm thư viện) thay vì làm hỏng cả job
        run: npx playwright install --with-deps chromium || npx playwright install chromium

      - name: Chạy test trình duyệt
        run: npx playwright test

      - name: Lưu báo cáo khi lỗi (ảnh chụp + trace)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Trang tài liệu docs.monlabs.fun (VitePress): build phải chạy và không có link hỏng
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sites/docs
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Cài VitePress
        run: npm install --no-audit --no-fund

      - name: Build trang tài liệu
        run: npm run build
